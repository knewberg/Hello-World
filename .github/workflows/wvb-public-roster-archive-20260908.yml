name: Materialize public NCAA WVB roster archive

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/wvb-public-roster-archive-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and audit roster files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rosters
          base='https://raw.githubusercontent.com/Sports-Roster-Data/womens-volleyball/main/data'
          for file in \
            rosters_2022.csv \
            rosters_2023.csv \
            rosters_2023_cleaned.csv \
            finished_rosters.csv \
            rosters_2023-24.csv \
            rosters_2024-25.csv \
            rosters_2025-26.csv \
            rosters_2026-27.csv \
            teams.csv \
            vb_teams.csv; do
            curl --fail --location --retry 4 --retry-all-errors "${base}/${file}" -o "rosters/${file}"
            test -s "rosters/${file}"
          done
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json
          audit=[]
          for path in sorted(Path('rosters').glob('*.csv')):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  reader=csv.reader(f)
                  header=next(reader)
                  rows=sum(1 for _ in reader)
              audit.append({
                  'file':path.name,
                  'rows':rows,
                  'columns':len(header),
                  'header':header,
                  'bytes':path.stat().st_size,
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          Path('rosters/public_roster_archive_audit.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PUBLIC_NCAA_WVB_ROSTER_ARCHIVE
          path: rosters/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
