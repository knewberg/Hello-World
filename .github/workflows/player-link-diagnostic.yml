name: NCAA Volleyball Player Link Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [sweep-analysis-2023-2025]
    paths:
      - player_link_diagnostic.py
      - .github/workflows/player-link-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sweep-analysis-2023-2025
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python player_link_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: player-link-diagnostic
          path: player_link_diagnostic_output/
          if-no-files-found: error
          retention-days: 30
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player_link_diagnostic_output
          git diff --cached --quiet || git commit -m 'Add player link diagnostic [skip ci]'
          git pull --rebase origin sweep-analysis-2023-2025
          git push origin HEAD:sweep-analysis-2023-2025
