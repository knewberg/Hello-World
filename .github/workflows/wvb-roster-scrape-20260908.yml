name: NCAA WVB full roster materialization

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/wvb-roster-scrape-20260908.yml'
      - 'scripts/wvb_roster_scrape.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and parser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyreadr playwright
          python -m playwright install --with-deps chromium

      - name: Materialize official NCAA Division I women's volleyball rosters
        run: python scripts/wvb_roster_scrape.py

      - name: Upload roster archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NCAA_WVB_FULL_ROSTERS_2023_2026
          path: rosters/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
