name: WVB historical materialization 2026-09-08

on:
  push:
    paths:
      - '.github/workflows/wvb-materialize-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_BASE: https://media.githubusercontent.com/media/JeffreyRStevens/ncaavolleyballr/refs/heads/main/data-csv

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download immutable NCAA Division I WVB archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2023 2024 2025; do
            for kind in playerseason playermatch teammatch; do
              file="wvb_${kind}_div1_${year}.csv"
              echo "Downloading ${file}"
              curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
                "${DATA_BASE}/${file}" -o "data/${file}"
              test -s "data/${file}"
            done
          done

      - name: Verify known player-match archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json
          expected = {
              2023: {"rows": 56897, "bytes": 8319844, "sha256": "7daa7f9b042fb668efed060065cdd7d5b54364d7deddb468469e761809923bc6"},
              2024: {"rows": 57902, "bytes": 8447102, "sha256": "39dd79a24a179caec1ebaaef13b8bd299eafa8c3cfc2cca8e664683455296bb9"},
              2025: {"rows": 70122, "bytes": 9516288, "sha256": "43a76168edc8b28d78f2bcea9c007c2e6d92bbce2437547627768606b08deb62"},
          }
          audit = []
          for path in sorted(Path('data').glob('*.csv')):
              b = path.read_bytes()
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  rows = sum(1 for _ in csv.reader(f)) - 1
              rec = {"file": path.name, "rows": rows, "bytes": len(b), "sha256": hashlib.sha256(b).hexdigest()}
              for year, exp in expected.items():
                  if path.name == f'wvb_playermatch_div1_{year}.csv':
                      rec["expected"] = exp
                      rec["integrity_pass"] = rows == exp["rows"] and len(b) == exp["bytes"] and rec["sha256"] == exp["sha256"]
                      if not rec["integrity_pass"]:
                          raise SystemExit(f'Integrity failure: {rec}')
              audit.append(rec)
          Path('data/source_audit.json').write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8')
          for r in audit:
              print(r)
          PY

      - name: Upload historical archive
        uses: actions/upload-artifact@v4
        with:
          name: wvb-historical-2023-2025
          path: data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
