name: WVB historical materialization 2026-09-08

on:
  push:
    paths:
      - '.github/workflows/wvb-materialize-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_BASE: https://media.githubusercontent.com/media/JeffreyRStevens/ncaavolleyballr/refs/heads/main/data-csv

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download 2021-2022 NCAA Division I WVB archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          for year in 2021 2022; do
            for kind in playerseason playermatch teammatch; do
              file="wvb_${kind}_div1_${year}.csv"
              echo "Downloading ${file}"
              curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 \
                "${DATA_BASE}/${file}" -o "data/${file}"
              test -s "data/${file}"
            done
          done

      - name: Audit row counts and hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv, hashlib, json
          audit = []
          for path in sorted(Path('data').glob('*.csv')):
              b = path.read_bytes()
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  reader = csv.reader(f)
                  header = next(reader)
                  rows = sum(1 for _ in reader)
              rec = {
                  "file": path.name,
                  "rows": rows,
                  "columns": len(header),
                  "bytes": len(b),
                  "sha256": hashlib.sha256(b).hexdigest(),
                  "header": header,
              }
              if rows <= 0 or not header:
                  raise SystemExit(f'Invalid archive: {rec}')
              audit.append(rec)
              print({k: rec[k] for k in ('file','rows','columns','bytes','sha256')})
          if len(audit) != 6:
              raise SystemExit(f'Expected 6 CSVs, got {len(audit)}')
          Path('data/source_audit.json').write_text(json.dumps(audit, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload historical archive
        uses: actions/upload-artifact@v4
        with:
          name: wvb-historical-2021-2022
          path: data/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
