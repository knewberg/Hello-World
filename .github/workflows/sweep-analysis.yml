name: NCAA Volleyball Sweep Analysis 2023-2025

on:
  workflow_dispatch:
  push:
    branches:
      - sweep-analysis-2023-2025
    paths:
      - analysis/sweep_parts/**
      - .github/workflows/sweep-analysis.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: sweep-analysis-2023-2025

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore and validate analysis script
        run: |
          cat analysis/sweep_parts/part_* > /tmp/sweep_analysis.py.gz.b64
          test "$(wc -c < /tmp/sweep_analysis.py.gz.b64)" -eq 22920
          base64 --decode /tmp/sweep_analysis.py.gz.b64 | gzip --decompress > analysis/sweep_analysis.py
          test "$(wc -c < analysis/sweep_analysis.py)" -eq 63910
          python -m py_compile analysis/sweep_analysis.py

      - name: Install analytical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn statsmodels requests

      - name: Run historical sweep analysis
        run: python analysis/sweep_analysis.py

      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-analysis-results
          path: sweep_results/
          if-no-files-found: error
          retention-days: 30

      - name: Commit result tables and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sweep_results
          if ! git diff --cached --quiet; then
            git commit -m "Add 2023-2025 sweep analysis results [skip ci]"
            git push origin HEAD:sweep-analysis-2023-2025
          fi
