name: NCAA Volleyball Sweep Analysis 2023-2025

on:
  workflow_dispatch:
  push:
    branches:
      - sweep-analysis-2023-2025
    paths:
      - sweep_analysis.py
      - .github/workflows/sweep-analysis.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4
        with:
          ref: sweep-analysis-2023-2025

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate analysis script
        run: python -m py_compile sweep_analysis.py

      - name: Install analytical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy scikit-learn statsmodels matplotlib

      - name: Run historical sweep analysis
        run: python sweep_analysis.py

      - name: Upload complete results
        uses: actions/upload-artifact@v4
        with:
          name: sweep-analysis-results
          path: sweep_output/
          if-no-files-found: error
          retention-days: 30

      - name: Commit result tables and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sweep_output
          if ! git diff --cached --quiet; then
            git commit -m "Add 2023-2025 sweep analysis results [skip ci]"
            git push origin HEAD:sweep-analysis-2023-2025
          fi
